onboarding = false

[keys]
prefix = "ctrl+space"
settings = ["prefix+shift+s", "ctrl+comma"]
new_workspace = ["prefix+shift+n", "alt+shift+n"]
previous_workspace = "alt+shift+h"
next_workspace = "alt+shift+l"
switch_workspace = "alt+shift+1..9"
help = ["prefix+?", "alt+?"]
detach = ["prefix+d", "alt+d"]
reload_config = ["prefix+shift+r", "alt+r"]
workspace_picker = ["prefix+\\", "prefix+m", "alt+m", "alt+="]
rename_workspace = ["prefix+comma", "alt+comma"]
new_tab = ["prefix+w", "alt+w"]
rename_tab = ["prefix+period", "alt+period"]
previous_tab = "alt+h"
next_tab = "alt+l"
switch_tab = ["prefix+1..9", "alt+1..9"]
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = ["prefix+s", "alt+s"]
split_horizontal = ["prefix+v", "alt+v"]
close_pane = ["prefix+x", "alt+x"]
toggle_sidebar = ["prefix+b", "alt+b"]

[[keys.command]]
key = "alt+t"
type = "popup"
command = 'exec "${SHELL:-/bin/sh}"'
width = "80%"
height = "80%"

[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "system"
