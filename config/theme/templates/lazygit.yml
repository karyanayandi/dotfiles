# ANSI foregrounds follow OSC updates; selection background needs config reload.
gui:
  theme:
    activeBorderColor: [green, bold]
    inactiveBorderColor: [white]
    searchingActiveBorderColor: [yellow]
    optionsTextColor: [blue]
    selectedLineBgColor: ["{{colors.surface_container_high.default.hex}}"]
    cherryPickedCommitBgColor: [default]
    cherryPickedCommitFgColor: [green]
    unstagedChangesColor: [red]
    defaultFgColor: [default]
