# wallpaper-theme passes this explicitly; no ~/.config/matugen directory needed.
[config]

[templates.mpv]
input_path = './templates/mpv.conf'
output_path = '~/.config/theme/generated/mpv.conf'

[templates.chromium]
input_path = './templates/chromium.json'
output_path = '~/.config/theme/generated/chromium/manifest.json'

[templates.firefox]
input_path = './templates/firefox.css'
output_path = '~/.config/theme/generated/firefox/userChrome.css'

[templates.quickshell]
input_path = "./templates/quickshell.json"
output_path = "~/.config/quickshell/colors.json"

[templates.hypr]
input_path = "./templates/hypr.lua"
output_path = "~/.config/hypr/colors.lua"

[templates.niri]
input_path = "./templates/niri.kdl"
output_path = "~/.config/niri/colors.kdl"

[templates.gtk2]
input_path = "./templates/gtk2.rc"
output_path = "~/.config/gtk-2.0/gtkrc"

[templates.gtk3]
input_path = "./templates/gtk3.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path = "./templates/gtk4.css"
output_path = "~/.config/gtk-4.0/colors.css"

[templates.qt5ct]
input_path = "./templates/qt5ct.conf"
output_path = "~/.config/qt5ct/colors-generated.conf"

[templates.qt6ct]
input_path = "./templates/qt6ct.conf"
output_path = "~/.config/qt6ct/colors-generated.conf"

[templates.foot]
input_path = "./templates/foot.ini"
output_path = "~/.config/theme/generated/foot.ini"

[templates.ghostty]
input_path = "./templates/ghostty.conf"
output_path = "~/.config/theme/generated/ghostty"

[templates.bottom-base]
input_path = "../bottom/bottom.toml"

[templates.bottom]
input_path = "./templates/bottom.toml"
output_path = "~/.config/theme/generated/bottom.toml"

[templates.starship-base]
input_path = "../starship/starship.toml"

[templates.starship]
input_path = "./templates/starship.toml"
output_path = "~/.config/theme/generated/starship.toml"

[templates.vivid-base]
input_path = "../vivid/colors.yaml"

[templates.vivid]
input_path = "./templates/vivid.yaml"
output_path = "~/.config/theme/generated/vivid.yaml"

[templates.lazydocker-base]
input_path = "../lazydocker/config.yml"

[templates.lazydocker]
input_path = "./templates/lazydocker.yml"
output_path = "~/.config/theme/generated/lazydocker/config.yml"

[templates.lazygit]
input_path = "./templates/lazygit.yml"
output_path = "~/.config/theme/generated/lazygit.yml"

[templates.bat]
input_path = "./templates/bat.tmTheme"
output_path = "~/.config/theme/generated/bat/themes/matugen.tmTheme"
post_hook = 'bat cache --build --source "$HOME/.config/theme/generated/bat"'

[templates.fish]
input_path = "./templates/fish.fish"
output_path = "~/.config/theme/generated/fish.fish"

[templates.tmux]
input_path = "./templates/tmux.conf"
output_path = "~/.config/theme/generated/tmux.conf"

[templates.nvim]
input_path = "./templates/nvim.lua"
output_path = "~/.config/theme/generated/nvim.lua"

[templates.pi]
input_path = '~/.config/theme/templates/pi.json'
output_path = '~/.pi/agent/themes/matugen.json'

[templates.opencode]
input_path = '~/.config/theme/templates/opencode.json'
output_path = '~/.config/opencode/themes/matugen.json'

[templates.tmux-status]
input_path = '~/.config/theme/templates/tmux.sh'
output_path = '~/.cache/theme/tmux.sh'

[templates.yazi]
input_path = "./templates/yazi.toml"
output_path = "~/.config/theme/generated/yazi.toml"

[templates.imv]
input_path = "./templates/imv.ini"
output_path = "~/.config/theme/generated/imv.conf"

[templates.fastfetch]
input_path = "./templates/fastfetch.jsonc"
output_path = "~/.config/theme/generated/fastfetch.jsonc"

[templates.wiremix]
input_path = "./templates/wiremix.toml"
output_path = "~/.config/theme/generated/wiremix.toml"

